name: Audit casks and formulae
description: brew style and brew audit (online) on every cask and formula of this tap; formulae are installed and tested too. Needs setup-homebrew to have run first.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        brew style ipsupport-llc/tap
        for cask in Casks/*.rb; do
          brew audit --cask --online --strict "ipsupport-llc/tap/$(basename "$cask" .rb)"
        done
        for formula in Formula/*.rb; do
          name="ipsupport-llc/tap/$(basename "$formula" .rb)"
          brew audit --formula --online --strict "$name"
          brew install "$name"
          brew test "$name"
        done
