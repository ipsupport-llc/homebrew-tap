name: Audit casks and formulae
description: brew style and brew audit (online) on every cask and formula of this tap; formulae are installed and tested too
runs:
  using: composite
  steps:
    - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main, 2026-10-10
    - shell: bash
      run: |
        brew style ipsupport-llc/tap
        for cask in Casks/*.rb; do
          brew audit --cask --online --strict "ipsupport-llc/tap/$(basename "$cask" .rb)"
        done
        for formula in Formula/*.rb; do
          name="ipsupport-llc/tap/$(basename "$formula" .rb)"
          brew audit --formula --online --strict "$name"
          brew install "$name"
          brew test "$name"
        done
