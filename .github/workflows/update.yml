name: Update casks

# Moves every cask to its product's latest stable release (see
# scripts/update-casks.sh). Runs on a schedule, so a product's release
# workflow needs no token for this repository; run it by hand to pick up
# a release right away.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Before the update, never after it: setup-homebrew empties the
      # workspace and force-checks out the commit that triggered the run,
      # which threw away every bump the updater had just made.
      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main, 2026-10-10
      - name: Update
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "changed<<EOF"
            ./scripts/update-casks.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Audit
        if: steps.update.outputs.changed != ''
        uses: ./.github/actions/audit
      - name: Commit
        if: steps.update.outputs.changed != ''
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # setup-homebrew re-creates the checkout without the credentials
          # actions/checkout left in it, so push with the token explicitly.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks Formula
          git commit -qm "$(printf 'Update casks\n\n%s' "$CHANGED")"
          # Another push may land meanwhile: replay this commit on top of it.
          # A failed pull must not end the step (bash -e) before the next
          # attempt; a conflicted rebase is undone and left to the next run.
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && exit 0
            [ "$attempt" -eq 3 ] && break
            sleep $((attempt * 5))
            git pull --rebase -q "$remote" main || git rebase --abort || true
          done
          exit 1
